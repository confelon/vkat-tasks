<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How-to: data, training, benchmark</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* The page is README.md rendered client-side by vendored marked.js */
    .howto { text-align: left; }
    .howto p, .howto ul, .howto h1, .howto h2 { text-align: left; color: #444; }
    .howto h1, .howto h2 { color: #2b2b52; }
    pre {
      background: #f4f4f0;
      border: 1px solid #e1e0d9;
      border-radius: 0.5rem;
      padding: 0.8rem 1rem;
      font-size: 0.78rem;
      line-height: 1.45;
      overflow-x: auto;
      color: #2b2b52;
    }
    code { background: #f4f4f0; padding: 0.1rem 0.25rem; border-radius: 0.25rem; }
    pre code { background: none; padding: 0; }
  </style>
</head>
<body>
  <div class="card howto">
    <a class="back" href="./">← Forecast</a>
    <div id="content"></div>
    <p class="footer"><a href="https://open-meteo.com/" target="_blank">Weather data by Open-Meteo</a></p>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script>
    // Russian readers get README.ru.md, everyone else README.md — same language
    // pick as the forecast page: saved choice first, then the browser's list
    const lang = localStorage.getItem("lang") || (navigator.language || "").slice(0, 2);
    fetch(lang === "ru" ? "readme?lang=ru" : "readme")
      .then((response) => response.text())
      .then((markdown) => {
        // The README hardcodes the dev address; show the address the app is
        // actually served from — origin plus the reverse-proxy sub-path, if any
        const appBase = new URL(".", location.href).href.replace(/\/$/, "");
        document.getElementById("content").innerHTML = marked.parse(
          markdown.replaceAll("http://localhost:8000", appBase)
        );
      });
  </script>
</body>
</html>
